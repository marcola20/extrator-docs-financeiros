# A demonstração pública: Postgres, API e tela, no plano gratuito do Render.
#
# É a mesma aplicação do `docker-compose.yml`, com quatro diferenças que estão
# todas em variável de ambiente — nenhuma linha de código sabe que existe Render:
#
#   DEMO_SOMENTE_LEITURA=1  a API responde 403 em POST de correção (ADR 012)
#   dockerCommand           migra antes de servir (docker/inicia-demo.sh)
#   API_INTERNA             onde o SERVIDOR do Next alcança a API
#   API_PUBLICA             onde o NAVEGADOR alcança a API, só para acordá-la
#
# ## Por que a tela fala com a API pela internet
#
# Rede privada entre serviços é recurso de plano pago. No gratuito, os dois são
# serviços web com URL pública, e o servidor do Next chama a API por ela. O
# navegador continua sem buscar nada na API direto: tudo passa por `/api/*` no
# próprio front, que é o que mantém o `<iframe>` do PDF na mesma origem. A única
# exceção é acordá-la — ver API_PUBLICA, mais abaixo.
#
# O custo é o cold start: são **dois** serviços dormindo, e a primeira visita
# acorda os dois em série. A interface trata isso explicitamente — ver
# `web/componentes/Carregando.tsx` e `AvisoDaApi.tsx`.
#
# ## O banco não sobrevive para sempre, e é semeado uma vez
#
# Postgres gratuito no Render expira, e quando expirar a fila some junto. Isso é
# aceitável aqui e não seria em outro lugar: **nada** neste banco é original.
# Tudo veio do corpus sintético versionado, e `semeia_fila` o reconstrói do zero.
# É a mesma razão do ADR 010 — o que carrega conteúdo de documento não é
# versionado, e o que não é versionado tem que ser descartável.
#
# A semeadura **não roda na partida** (ver docker/inicia-demo.sh): sob a cota do
# plano gratuito ela não termina antes de o serviço dormir. Ela roda uma vez, da
# máquina de desenvolvimento, com a External Database URL do painel do
# extrator-postgres — num banco novo, ou depois de ele expirar:
#
#   DATABASE_URL='<External Database URL>' PERSISTENCIA_ATIVA=1 LLM_SEM_REDE=1 \
#       uv run python -m app.geradores.semeia_fila --completar
#
# Leva uns 25 s. `--completar` o torna seguro de repetir; os caminhos gravados
# são relativos (`dados/sinteticos/...`), e o corpus dentro da imagem é o mesmo.
# A API migra na partida — num banco que ela ainda não viu, rode antes
# `uv run alembic upgrade head` com a mesma DATABASE_URL.

databases:
  - name: extrator-postgres
    plan: free
    databaseName: extrator
    user: extrator

services:
  - type: web
    name: extrator-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migra e serve. A fila não é semeada aqui — ver o script.
    dockerCommand: ./docker/inicia-demo.sh
    healthCheckPath: /health
    envVars:
      # A URL vem do próprio Render, e a senha nunca passa por este arquivo.
      # Ela chega no formato da libpq (`postgres://`), sem driver; quem completa
      # é `Settings.com_driver_explicito`, em `app/config.py`.
      - key: DATABASE_URL
        fromDatabase:
          name: extrator-postgres
          property: connectionString
      - key: PERSISTENCIA_ATIVA
        value: "1"
      # O que faz desta instância uma demonstração, e não uma cópia do sistema.
      - key: DEMO_SOMENTE_LEITURA
        value: "1"
      # A demonstração não tem chave de API e não precisa de uma: a API só lê o
      # banco, e nada neste serviço extrai documento. A trava transforma qualquer
      # tentativa de chamar o modelo em erro alto, em vez de deixá-la falhar por
      # falta de chave — que seria o mesmo resultado dito de um jeito pior.
      - key: LLM_SEM_REDE
        value: "1"

  - type: web
    name: extrator-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    envVars:
      # ## As duas URLs da API, e por que não são uma
      #
      # Hoje as duas têm o mesmo valor — https://<nome-do-serviço>.onrender.com —
      # e respondem a perguntas diferentes. Confundi-las quebra de um jeito que
      # não aparece localmente.
      #
      # API_INTERNA é onde o **servidor** do Next alcança a API. Todo o tráfego
      # passa por ela: as páginas e o proxy `/api/*`. No `docker compose` ela é
      # `http://api:8000`, e num plano pago seria o endereço da rede privada.
      #
      # API_PUBLICA é onde o **navegador** alcança a API, e serve para uma coisa
      # só: o layout manda o navegador chamar `/health`, em `no-cors`, com a
      # resposta descartada. Existe porque chamada do servidor do front à URL
      # pública da API **não acorda** o serviço gratuito — medido, 502 por 16
      # minutos seguidos pelo proxy, e 33 s para acordar com uma chamada de fora
      # (ADR 012). É lida no servidor a cada requisição, e não no build, e por
      # isso não é NEXT_PUBLIC_. Sem ela, nada é disparado.
      #
      # `sync: false` faz o Render **perguntar** as duas ao criar o blueprint,
      # em vez de deixar um palpite gravado aqui: a URL pública depende do nome
      # que o serviço acabou recebendo — se `extrator-api` já estiver em uso, o
      # Render sufixa —, e uma URL errada apareceria como "a API não respondeu"
      # numa tela que, por desenho, culpa o cold start. Num blueprint que já
      # existe, variável nova com `sync: false` não é perguntada: ela se cadastra
      # à mão no painel do extrator-web.
      - key: API_INTERNA
        sync: false
      - key: API_PUBLICA
        sync: false
