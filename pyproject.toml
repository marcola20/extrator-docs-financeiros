[project]
name = "extrator-docs-financeiros"
version = "0.1.0"
description = "Extração estruturada de documentos financeiros brasileiros com validação determinística"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "jinja2>=3.1",
    "weasyprint>=62.3",
    "faker>=30",
    "google-genai>=2.22.0",
    "pytesseract>=0.3.13",
    "alembic>=1.19.2",
    "langfuse>=4.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "ANN",      # annotations obrigatórias
    "RUF",      # regras do ruff
]
ignore = [
    "ANN401",   # Any explícito é permitido quando necessário
    "N818",     # exceção em português usa o prefixo "Erro", não o sufixo "Error"
]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Bibliotecas sem type hints publicados (sem py.typed).
module = ["weasyprint.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # A suíte inteira passou de dez minutos, quase toda em OCR: cada teste
    # marcado renderiza o PDF e roda tesseract sobre a página. Rodar isso a
    # cada revisão de commit não paga — a verificação commit-a-commit usa
    # `pytest -m "not slow"`, e a verificação final e o CI rodam tudo.
    "slow: renderiza página e chama OCR; fora de `pytest -m \"not slow\"`",
]
